<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="falconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#635BFF"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="goldEye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#635BFF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Shield / Hexagon (Subtle) -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="#0A2540" rx="8" filter="url(#glow)"/>
  
  <!-- Aerodynamic Falcon Wings & Head Body -->
  <!-- Left Wing Plume -->
  <path d="M 50 18 L 18 38 L 32 50 L 50 36 Z" fill="url(#falconGrad)" opacity="0.9"/>
  <path d="M 50 36 L 24 54 L 38 64 L 50 50 Z" fill="url(#falconGrad)" opacity="0.8"/>
  <path d="M 50 50 L 30 68 L 44 76 L 50 64 Z" fill="url(#falconGrad)" opacity="0.7"/>

  <!-- Right Wing Plume -->
  <path d="M 50 18 L 82 38 L 68 50 L 50 36 Z" fill="url(#falconGrad)" opacity="0.9"/>
  <path d="M 50 36 L 76 54 L 62 64 L 50 50 Z" fill="url(#falconGrad)" opacity="0.8"/>
  <path d="M 50 50 L 70 68 L 56 76 L 50 64 Z" fill="url(#falconGrad)" opacity="0.7"/>

  <!-- Falcon Crest Head & Beak -->
  <path d="M 50 14 L 58 28 L 50 42 L 42 28 Z" fill="#FFFFFF"/>
  <polygon points="50,22 53,27 47,27" fill="url(#goldEye)"/>
  
  <!-- Falcon Beak Tip -->
  <polygon points="50,42 53,36 47,36" fill="url(#goldEye)"/>
</svg>
