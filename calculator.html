<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Project & Retainer Estimator | GALICON GLOBAL</title>
  <meta name="description" content="Calculate turnkey packages across our 4 core divisions. Select your required tier and currency for instant transparent estimation.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Poppins', sans-serif; background:#050505; color:#fff; min-height:100vh; line-height:1.6; }
    .container-calc { max-width:960px; margin:60px auto; padding:0 20px; }
    .bg-dark { background-color: #0d0d0d !important; }
    .bg-black { background-color: #000000 !important; }
    .border-secondary { border-color: rgba(255,255,255,0.08) !important; }
    .border-warning { border-color: #EAB308 !important; }
    .text-warning { color: #EAB308 !important; }
    .form-select, .form-check-input { background-color: #000 !important; color: #fff !important; border-color: rgba(255,255,255,0.15) !important; }
    .form-select:focus { border-color: #EAB308 !important; box-shadow: none !important; }
    .form-check-input:checked { background-color: #EAB308 !important; border-color: #EAB308 !important; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div id="navbar-placeholder"></div>

  <div class="container container-calc">
    
    <div class="calculator-container p-4 bg-dark text-white rounded-3 border border-secondary shadow-lg">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
          <h4 class="fw-bold mb-0 text-warning">Custom Project & Retainer Estimator</h4>
          <p class="text-muted small mb-0">Select your required tier and currency for instant transparent estimation.</p>
        </div>
        
        <!-- Currency Selector -->
        <div class="currency-selector">
          <select class="form-select bg-black text-warning border-warning" onchange="window.galiconCalc.setCurrency(this.value)">
            <option value="INR" selected>INR (₹ - India)</option>
            <option value="SAR">SAR (ر.س - Saudi Arabia)</option>
            <option value="USD">USD ($ - Global / US)</option>
            <option value="AED">AED (د.إ - UAE)</option>
          </select>
        </div>
      </div>

    <form onsubmit="handleLeadFormSubmit(event)">
      <div class="row g-4">
        <!-- Configuration Column -->
        <div class="col-lg-7">
          <div class="mb-3">
            <label class="form-label text-muted small fw-bold text-uppercase">1. Select Strategic Division</label>
            <select class="form-select bg-black text-white border-secondary" id="divisionSelect" onchange="updateTiersDropdown(this.value)">
              <option value="consulting">Business & Consulting (/start/)</option>
              <option value="marketing" selected>Marketing & Growth (/grow/)</option>
              <option value="technology">Technology & AI (/technology/)</option>
              <option value="events">Experiences & Productions (/events/)</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted small fw-bold text-uppercase">2. Select Package Tier</label>
            <select class="form-select bg-black text-white border-secondary" id="tierSelect" onchange="applyTierSelection()">
              <option value="funnel">Funnel & Tracking Architecture (Setup)</option>
              <option value="performance" selected>Performance Engine Retainer (Monthly)</option>
              <option value="fullFunnel">Full-Funnel Growth Partner (Monthly)</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted small fw-bold text-uppercase">3. Optional Strategic Add-Ons</label>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="add1" onchange="window.galiconCalc.toggleAddOn('zatcaKit')">
              <label class="form-check-label small" for="add1">ZATCA Phase 2 E-Invoicing Template Pack</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="add2" onchange="window.galiconCalc.toggleAddOn('crmSync')">
              <label class="form-check-label small" for="add2">Autonomous Node.js Lead Scorer Daemon</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="add3" onchange="window.galiconCalc.toggleAddOn('translationBooths')">
              <label class="form-check-label small" for="add3">Simultaneous Translation Booths (AV)</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="add4" onchange="window.galiconCalc.toggleAddOn('videoProduction')">
              <label class="form-check-label small" for="add4">4K Cinematic Aftermovie & Drone</label>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted small fw-bold text-uppercase">4. Contact Information</label>
            <div class="row g-2 mb-2">
              <div class="col-md-6">
                <input type="text" id="client-name" class="form-control bg-black text-white border-secondary" placeholder="Your Name *" required>
              </div>
              <div class="col-md-6">
                <input type="email" id="client-email" class="form-control bg-black text-white border-secondary" placeholder="email@company.com *" required>
              </div>
            </div>
            <div class="mb-2">
              <input type="tel" id="client-phone" class="form-control bg-black text-white border-secondary" placeholder="Phone Number / WhatsApp *" required>
            </div>
            <div>
              <textarea id="client-notes" class="form-control bg-black text-white border-secondary" rows="2" placeholder="Briefly describe your project or event details..."></textarea>
            </div>
          </div>
        </div>

        <!-- Output Total Column -->
        <div class="col-lg-5 d-flex flex-column justify-content-center">
          <div class="p-4 bg-black rounded-3 border border-warning text-center">
            <div class="text-muted small text-uppercase fw-bold">Estimated Investment</div>
            <div class="h2 text-warning fw-bold my-2" id="estimated-price-display">₹50,000</div>
            <div class="text-muted small mb-3" id="billing-type-label">/ month</div>
            
            <button type="submit" class="btn btn-warning w-100 fw-bold text-dark py-2 mb-2">
              Confirm Inquiry ➜
            </button>
            <a href="#" id="whatsapp-export-btn" style="display:none;"></a>
          </div>
        </div>
      </div>
    </form>
  </div>

  <script src="calculator.js"></script>
  <script>
    // Synchronize UI dropdowns with the core pricing class
    function updateTiersDropdown(divKey) {
      const tierSelect = document.getElementById("tierSelect");
      tierSelect.innerHTML = "";
      
      const division = GALICON_PRICING_CONFIG.divisions[divKey];
      Object.keys(division.tiers).forEach(tk => {
        const tier = division.tiers[tk];
        const opt = document.createElement("option");
        opt.value = tk;
        opt.innerText = `${tier.name} (${tier.type === "monthly" ? "Monthly" : "Fixed"})`;
        tierSelect.appendChild(opt);
      });
      
      // Auto select the first tier in new division
      const firstTierKey = Object.keys(division.tiers)[0];
      window.galiconCalc.setDivisionAndTier(divKey, firstTierKey);
    }
    
    function applyTierSelection() {
      const divKey = document.getElementById("divisionSelect").value;
      const tierKey = document.getElementById("tierSelect").value;
      window.galiconCalc.setDivisionAndTier(divKey, tierKey);
    }

    // Wrap render function of pricing engine to keep checkboxes synced
    const originalRender = GaliconEstimator.prototype.render;
    GaliconEstimator.prototype.render = function() {
      originalRender.call(this);
      
      // Sync checkbox state
      const add1 = document.getElementById("add1");
      const add2 = document.getElementById("add2");
      const add3 = document.getElementById("add3");
      const add4 = document.getElementById("add4");

      if (add1) add1.checked = this.selectedAddOns.has("zatcaKit");
      if (add2) add2.checked = this.selectedAddOns.has("crmSync");
      if (add3) add3.checked = this.selectedAddOns.has("translationBooths");
      if (add4) add4.checked = this.selectedAddOns.has("videoProduction");
    }

    async function handleLeadFormSubmit(event) {
      event.preventDefault();

      const payload = {
        name: document.getElementById('client-name').value,
        email: document.getElementById('client-email').value,
        phone: document.getElementById('client-phone').value,
        division: document.getElementById('divisionSelect').value,
        packageSelected: document.getElementById('tierSelect').value,
        country: window.galiconCalc ? window.galiconCalc.selectedCurrency : "INR",
        message: document.getElementById('client-notes').value
      };

      const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
        ? 'http://localhost:4000'
        : 'https://api.galiconglobal.com';

      try {
        const response = await fetch(`${API_BASE}/api/leads/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (result.success) {
          alert("Inquiry received! Founder Ismail Kazia will connect within 2 hours.");
          window.location.href = "meet.html";
        }
      } catch (err) {
        console.error("Submission error:", err);
        // Fallback: Direct WhatsApp trigger if server is temporarily unreachable
        window.open(window.galiconCalc.generateWhatsAppUrl(), '_blank');
      }
    }
  </script>

  <div id="footer-placeholder"></div>

  <script src="components/navbar.js"></script>
  <script src="components/footer.js"></script>
</body>
</html>
