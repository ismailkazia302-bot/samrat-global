    .bg-black { background-color: #020617 !important; }
    .border-secondary { border-color: rgba(255,255,255,0.08) !important; }
    .border-warning { border-color: rgba(99,102,241,0.4) !important; }
    .text-warning { color: #818CF8 !important; }
    .form-select, .form-check-input { background-color: #020617 !important; color: #fff !important; border-color: rgba(255,255,255,0.15) !important; }
    .form-select:focus { border-color: #6366F1 !important; box-shadow: none !important; }
    .form-check-input:checked { background-color: #6366F1 !important; border-color: #6366F1 !important; }
  </style>

  <meta property="og:type" content="website">

  <meta property="og:site_name" content="GALICON GLOBAL">
  <meta name="author" content="Ismail Kazia">

  <!-- Schema.org JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Service",
    "name": "Interactive Multi-Currency Project Estimator | GALICON GLOBAL",
    "url": "https://ismailkazia302-bot.github.io/samrat-global/calculator.html",
    "description": "Calculate transparent project budgets and monthly retainers across INR, USD, SAR, and AED.",
    "author": {
      "@type": "Person",
      "name": "Ismail Kazia",
      "jobTitle": "Founder & CEO"
    },
    "publisher": {
      "@type": "Organization",
      "name": "GALICON GLOBAL",
      "url": "https://ismailkazia302-bot.github.io/samrat-global/",
      "logo": "https://ismailkazia302-bot.github.io/samrat-global/galicon_logo.png"
    }
  }
  </script>
</head>
<body>
  <h1 class="visually-hidden">GALICON GLOBAL — Multi-Currency Project Estimator</h1>

  <!-- Navbar -->
  <div id="navbar-placeholder"></div>

  <div class="container container-calc">
    
    <div class="calculator-container p-4 bg-dark text-white rounded-3 border border-secondary shadow-lg">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
          <h4 class="fw-bold mb-0 text-warning">Project Scope & Retainer Estimator</h4>
          <p class="text-muted small mb-0">Select your required tier and currency for instant transparent estimation.</p>
        </div>
        
        <!-- Currency Selector -->
        <div class="currency-selector">
          <select class="form-select bg-black text-warning border-warning" onchange="window.galiconCalc.setCurrency(this.value)">
            <option value="INR" selected>INR (₹ - India)</option>
            <option value="USD">USD ($ - Global / US)</option>
            <option value="SAR">SAR (ر.س - Saudi Arabia)</option>
            <option value="AED">AED (د.إ - UAE)</option>
          </select>
        </div>
      </div>

    <form onsubmit="handleLeadFormSubmit(event)">
      <div class="row g-4">
        <!-- Configuration Column -->
        <div class="col-lg-7">
          <div class="mb-3">
            <label class="form-label text-muted small fw-bold text-uppercase">1. Select Strategic Division</label>
            <select class="form-select bg-black text-white border-secondary" id="divisionSelect" onchange="updateTiersDropdown(this.value)">
              <option value="technology" selected>Technology & AI (/technology/)</option>
              <option value="marketing">Marketing & Growth (/growth/)</option>
              <option value="consulting">Business & Consulting (/business/)</option>
              <option value="events">Experiences & Productions (/experiences/)</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted small fw-bold text-uppercase">2. Select Deliverable / Tier</label>
            <select class="form-select bg-black text-white border-secondary" id="tierSelect" onchange="applyTierSelection()">
              <!-- Injected dynamically -->
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted small fw-bold text-uppercase">3. Optional Strategic Add-Ons</label>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="add1" onchange="window.galiconCalc.toggleAddOn('seoBoost')">
              <label class="form-check-label small" for="add1">100/100 Technical SEO & Schema Audit (+₹5,000)</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="add2" onchange="window.galiconCalc.toggleAddOn('paymentGateway')">
              <label class="form-check-label small" for="add2">Razorpay / UPI / NetBanking Gateway (+₹8,000)</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="add3" onchange="window.galiconCalc.toggleAddOn('crmSync')">
              <label class="form-check-label small" for="add3">Autonomous Lead Scorer Daemon & CRM Sync (+₹15,000)</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="add4" onchange="window.galiconCalc.toggleAddOn('videoProduction')">
              <label class="form-check-label small" for="add4">4K Cinematic Video & Drone Production (+₹25,000)</label>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted small fw-bold text-uppercase">4. Contact Information</label>
            <div class="row g-2 mb-2">
              <div class="col-md-6">
                <input type="text" id="client-name" class="form-control bg-black text-white border-secondary" placeholder="Your Name *" required>
              </div>
              <div class="col-md-6">
                <input type="email" id="client-email" class="form-control bg-black text-white border-secondary" placeholder="email@company.com *" required>
              </div>
            </div>
            <div class="mb-2">
              <input type="tel" id="client-phone" class="form-control bg-black text-white border-secondary" placeholder="Phone Number / WhatsApp *" required>
            </div>
            <div>
              <textarea id="client-notes" class="form-control bg-black text-white border-secondary" rows="2" placeholder="Briefly describe your requirements..."></textarea>
            </div>
          </div>
        </div>

        <!-- Output Total Column -->
        <div class="col-lg-5 d-flex flex-column justify-content-center">
          <div class="p-4 bg-black rounded-3 border border-warning text-center">
            <div class="text-muted small text-uppercase fw-bold">Estimated Investment</div>
            <div class="h2 text-warning fw-bold my-2" id="estimated-price-display">₹14,999</div>
            <div class="text-muted small mb-3" id="billing-type-label">Fixed Sprint Execution</div>
            
            <button type="submit" class="btn btn-warning w-100 fw-bold text-dark py-2 mb-2">
              Lock In Estimated Scope ➔
            </button>
            <a href="#" id="whatsapp-export-btn" target="_blank" class="btn btn-success w-100 fw-bold text-white py-2">
              <i class="fab fa-whatsapp me-1"></i> WhatsApp Instant Quote
            </a>
          </div>
        </div>
      </div>
    </form>
  </div>

  <script src="analytics_tracker.js"></script>
  <script src="calculator.js"></script>
  <script>
    function updateTiersDropdown(divKey) {
      const tierSelect = document.getElementById("tierSelect");
      tierSelect.innerHTML = "";
      
      const division = GALICON_PRICING_CONFIG.divisions[divKey];
      if (!division) return;

      Object.keys(division.tiers).forEach(tk => {
        const tier = division.tiers[tk];
        const opt = document.createElement("option");
        opt.value = tk;
        opt.innerText = `${tier.name} (${tier.type === "monthly" ? "Monthly" : "Fixed"})`;
        tierSelect.appendChild(opt);
      });
      
      const firstTierKey = Object.keys(division.tiers)[0];
      window.galiconCalc.setDivisionAndTier(divKey, firstTierKey);
    }
    
    function applyTierSelection() {
      const divKey = document.getElementById("divisionSelect").value;
      const tierKey = document.getElementById("tierSelect").value;
      window.galiconCalc.setDivisionAndTier(divKey, tierKey);
    }

    const originalRender = GaliconEstimator.prototype.render;
    GaliconEstimator.prototype.render = function() {
      originalRender.call(this);
      
      const add1 = document.getElementById("add1");
      const add2 = document.getElementById("add2");
      const add3 = document.getElementById("add3");
      const add4 = document.getElementById("add4");

      if (add1) add1.checked = this.selectedAddOns.has("seoBoost");
      if (add2) add2.checked = this.selectedAddOns.has("paymentGateway");
      if (add3) add3.checked = this.selectedAddOns.has("crmSync");
      if (add4) add4.checked = this.selectedAddOns.has("videoProduction");
    }

    async function handleLeadFormSubmit(event) {
      event.preventDefault();

      const attribution = typeof window.getGaliconAttribution === 'function' ? window.getGaliconAttribution() : {};

      const payload = {
        name: document.getElementById('client-name').value,
        email: document.getElementById('client-email').value,
        phone: document.getElementById('client-phone').value,
        division: document.getElementById('divisionSelect').value,
        packageSelected: document.getElementById('tierSelect').value,
        country: window.galiconCalc ? window.galiconCalc.selectedCurrency : "INR",
        attribution: attribution,
        message: document.getElementById('client-notes').value
      };

      const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
        ? 'http://localhost:4000'
        : 'https://api.galiconglobal.com';

      try {
        fetch(`${API_BASE}/api/leads/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(e => console.warn(e));

        alert("Inquiry received! Founder Ismail Kazia will connect with your project blueprint within 2 hours.");
        window.location.href = "meet.html";
      } catch (err) {
        window.open(window.galiconCalc.generateWhatsAppUrl(), '_blank');
      }
    }
  </script>

  <div id="footer-placeholder"></div>

  <script src="chatbot.js" defer></script>
  <script src="components/navbar.js"></script>
  <script src="components/footer.js"></script>
</body>
</html>
