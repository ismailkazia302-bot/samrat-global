<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Protected B2B enterprise CRM tracker and lead management dashboard for Founder Ismail Kazia.">
  <title>Executive CRM & Pipeline Command Center | GALICON GLOBAL</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome CDN -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:#050505; color:#ffffff; min-height:100vh; }
    
    /* Login Overlay Form */
    .login-container { max-width: 400px; margin: 15vh auto; padding: 32px; background: #0d0d0d; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .login-input { background: #141414 !important; border: 1px solid rgba(255,255,255,0.15) !important; color: #fff !important; }
    .login-input:focus { border-color: #EAB308 !important; box-shadow: none !important; }
    
    /* Dashboard Main Container (Hidden by default) */
    #dashboard-view { display: none; }
    
    .crm-header { padding:18px 28px; background:#0a0a0a; border-bottom:1px solid rgba(255,255,255,0.08); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; position:sticky; top:0; z-index:100; }
    .brand-title { font-size:1.3rem; font-weight:900; letter-spacing:2px; color:#fff; text-decoration:none; display:flex; align-items:center; gap:8px; }
    .brand-title span { color:#EAB308; }
    .nav-bar-links { display:flex; gap:18px; }
    .nav-bar-links a { color:#888; text-decoration:none; font-size:0.85rem; font-weight:700; transition:color 0.2s; }
    .nav-bar-links a:hover { color:#fff; }
    .search-input { background:#141414; border:1px solid rgba(255,255,255,0.15); border-radius:8px; padding:8px 16px; color:#fff; font-size:0.9rem; width:320px; outline:none; }
    .search-input:focus { border-color:#EAB308; }
    .stats-section { display:flex; gap:14px; padding:20px 28px; flex-wrap:wrap; }
    .stat-box { background:#0d0d0d; border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:16px 20px; flex:1; min-width:140px; text-align:center; }
    .stat-number { font-size:2rem; font-weight:900; }
    .stat-label { font-size:0.75rem; color:#888; text-transform:uppercase; font-weight:700; letter-spacing:1px; margin-top:4px; }
    .filter-wrapper { padding:10px 28px; display:flex; flex-direction:column; gap:10px; }
    .filter-group { display:flex; gap:8px; flex-wrap:wrap; }
    .filter-chip { background:#111; border:1px solid rgba(255,255,255,0.15); color:#999; padding:6px 16px; border-radius:20px; font-size:0.8rem; font-weight:700; cursor:pointer; transition:all 0.2s; }
    .filter-chip:hover, .filter-chip.active { background:#EAB308; color:#000; border-color:#EAB308; }
    .filter-chip-region.active { background:#3B82F6; color:#fff; border-color:#3B82F6; }
    .cards-container { padding:14px 28px 60px; display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:16px; }
    .crm-card { background:#0d0d0d; border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:20px; display:flex; flex-direction:column; justify-content:space-between; transition:border-color 0.2s, transform 0.2s; }
    .crm-card:hover { border-color:rgba(234,179,8,0.5); transform:translateY(-3px); }
    .card-title { font-size:1.05rem; font-weight:800; color:#fff; margin-bottom:4px; }
    .card-subtitle { font-size:0.82rem; color:#888; margin-bottom:12px; }
    .score-badge { display:inline-block; padding:3px 10px; border-radius:12px; font-size:0.75rem; font-weight:800; }
    .score-high { background:rgba(16,185,129,0.15); color:#10B981; }
    .score-mid { background:rgba(234,179,8,0.15); color:#EAB308; }
    .status-tag { display:inline-block; padding:3px 10px; border-radius:12px; font-size:0.72rem; font-weight:800; margin-left:6px; background:rgba(59,130,246,0.2); color:#60A5FA; }
    .card-buttons { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
    .btn-action { padding:8px 14px; border:none; border-radius:8px; font-size:0.8rem; font-weight:700; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px; transition:transform 0.2s; }
    .btn-action:hover { transform:translateY(-1px); color:#fff; }
    .btn-wa { background:#25D366; color:#000; }
    .btn-wa:hover { background:#22c55e; color:#000; }
    .btn-alt { background:#1a1a1a; color:#fff; border:1px solid rgba(255,255,255,0.15); }
    .no-results { grid-column:1/-1; text-align:center; padding:60px 20px; color:#666; }
    @media(max-width:768px) { .crm-header { padding:14px 20px; } .stats-section, .filter-wrapper, .cards-container { padding-left:16px; padding-right:16px; } .search-input { width:100%; } }
  
    /* UNIVERSAL HIGH-CONTRAST FONT VISIBILITY (GALICON 2026) */
    body { color: #F8FAFC !important; }
    p, li, .lead, .problem-pill, .audit-choice { color: #CBD5E1 !important; }
    .text-muted, .text-secondary { color: #CBD5E1 !important; }
    .card-dark, .div-card, .calc-card, .audit-card, .widescreen-booking-card { color: #F8FAFC !important; }
    .card-dark p, .card-dark li, .card-dark ul,
    .div-card p, .div-card li, .div-card ul,
    .calc-card p, .calc-card li, .calc-card ul,
    .audit-card p, .audit-card li, .audit-card ul,
    .widescreen-booking-card p, .widescreen-booking-card li { color: #E2E8F0 !important; }
    .price-box .text-muted, .div-price-chip .text-muted { color: #94A3B8 !important; }
  </style>

</head>
<body>

  <!-- 1. Login View -->
  <div class="container" id="login-view">
    <div class="login-container text-center">
      <h3 class="fw-bold text-white mb-2">👑 GALICON </h3>
      <p class="text-muted small mb-4">EXECUTIVE CRM SECURE LOGIN</p>
      
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="mb-3">
          <input type="password" id="admin-password" class="form-control login-input text-center py-2" placeholder="Enter Secure Password" required>
        </div>
        <button type="submit" class="btn btn-warning w-100 fw-bold py-2">Access Portal ➜</button>
      </form>
      <div id="login-error" class="text-danger small mt-3" style="display:none;">Invalid password context.</div>
    </div>
  </div>

  <!-- 2. CRM Dashboard View -->
  <div id="dashboard-view">
    <!-- Top Navbar -->
    <header class="crm-header">
      <div class="d-flex align-items-center gap-3">
        <h1 class="m-0" style="font-size: 1.25rem;"><a href="index.html" class="brand-title">👑 GALICON <span>CRM</span></a></h1>
        <div class="nav-bar-links d-none d-md-flex">
          <a href="index.html">Main Portal</a>
          <a href="products.html">Digital Store</a>
          <a href="outreach.html">Outreach Hub</a>
          <a href="#" onclick="handleLogout(event)" class="text-danger"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
      </div>
      <input type="text" class="search-input" placeholder="🔍 Search leads by name, city, service..." id="searchBox" oninput="onSearchChange()">
    </header>

    <!-- Metric Statistics -->
    <section class="stats-section">
      <div class="stat-box"><div class="stat-number" id="totalCount">0</div><div class="stat-label">Total B2B Leads</div></div>
      <div class="stat-box"><div class="stat-number text-primary" id="activeCount">0</div><div class="stat-label">Contacted / Active</div></div>
      <div class="stat-box"><div class="stat-number text-warning" id="vipCount">0</div><div class="stat-label">VIP Leads (95+ Score)</div></div>
      <div class="stat-box"><div class="stat-number text-success" id="marketCount">0</div><div class="stat-label">Global Markets</div></div>
    </section>

    <!-- Filter Bar -->
    <div class="filter-wrapper">
      <!-- Regional Filter Chips -->
      <div class="filter-group" id="regionGroup">
        <button class="filter-chip filter-chip-region active" onclick="selectRegion('All', this)">🌍 All Markets (<span id="cnt-all">0</span>)</button>
        <button class="filter-chip filter-chip-region" onclick="selectRegion('Saudi Arabia', this)">🇸🇦 Saudi Arabia (<span id="cnt-sa">0</span>)</button>
        <button class="filter-chip filter-chip-region" onclick="selectRegion('Bangalore', this)">🇮🇳 Bangalore (<span id="cnt-blr">0</span>)</button>
        <button class="filter-chip filter-chip-region" onclick="selectRegion('UAE', this)">🇦🇪 Dubai & UAE (<span id="cnt-uae">0</span>)</button>
        <button class="filter-chip filter-chip-region" onclick="selectRegion('UK', this)">🇬🇧 UK / London (<span id="cnt-uk">0</span>)</button>
        <button class="filter-chip filter-chip-region" onclick="selectRegion('Mumbai', this)">🇮🇳 Mumbai (<span id="cnt-mum">0</span>)</button>
        <button class="filter-chip filter-chip-region" onclick="selectRegion('Global', this)">🇺🇸 US & Singapore (<span id="cnt-glb">0</span>)</button>
      </div>

      <!-- 10-Person Sales Force Pod Dispatcher -->
      <div class="filter-group mt-2" id="repGroup">
        <span class="small text-secondary fw-bold me-2 d-inline-block align-self-center"><i class="fas fa-users-cog text-info me-1"></i>SALES REP POD:</span>
        <button class="filter-chip active" onclick="selectRep('All', this)">👥 All 10 Reps</button>
        <button class="filter-chip" onclick="selectRep('Rep 1 (Tech)', this)">⚡ Rep 1: Bug Sprints</button>
        <button class="filter-chip" onclick="selectRep('Rep 2 (AI)', this)">🤖 Rep 2: AI WhatsApp Bots</button>
        <button class="filter-chip" onclick="selectRep('Rep 3 (Apps)', this)">📱 Rep 3: Custom Mobile Apps</button>
        <button class="filter-chip" onclick="selectRep('Rep 4 (Ecom)', this)">🛍️ Rep 4: D2C Ecom Ads</button>
        <button class="filter-chip" onclick="selectRep('Rep 5 (GCC)', this)">🏙️ Rep 5: GCC Luxury Real Estate</button>
        <button class="filter-chip" onclick="selectRep('Rep 6 (B2B)', this)">📈 Rep 6: B2B Growth Retainers</button>
        <button class="filter-chip" onclick="selectRep('Rep 7 (BLR Events)', this)">🎪 Rep 7: Bangalore Summits</button>
        <button class="filter-chip" onclick="selectRep('Rep 8 (Saudi Events)', this)">🇸🇦 Rep 8: Saudi Conclaves</button>
        <button class="filter-chip" onclick="selectRep('Rep 9 (Advisory)', this)">🚀 Rep 9: Business Diagnostics</button>
        <button class="filter-chip" onclick="selectRep('Rep 10 (Inbound SDR)', this)">⚡ Rep 10: Speed-to-Lead</button>
      </div>

      <!-- Status Filter Chips -->
      <div class="filter-group mt-2" id="statusGroup">
        <button class="filter-chip active" onclick="selectStatus('All', this)">All Status</button>
        <button class="filter-chip" onclick="selectStatus('VIP', this)">VIP High Score (95+)</button>
      </div>
    </div>

    <!-- Cards Grid -->
    <main class="cards-container" id="cardsGrid">
      <!-- Rendered dynamically -->
    </main>
  </div>

  <script>
    // Resolve dynamic API Base URL
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:4000'
      : 'https://api.galiconglobal.com';

    let LEADS_STORE = [];
    let activeRegion = 'All';
    let activeStatus = 'All';
    let searchKeyword = '';

    // Check token or url param on load
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('auth') === 'galicon2030' || urlParams.get('pass') === 'galicon2030') {
        sessionStorage.setItem('samrat_crm_token', 'galicon_authenticated_executive_token_2030');
        localStorage.setItem('samrat_crm_token', 'galicon_authenticated_executive_token_2030');
      }

      const token = sessionStorage.getItem('samrat_crm_token') || localStorage.getItem('samrat_crm_token');
      if (token) {
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('dashboard-view').style.display = 'block';
        loadLeads(token);
      }
    });

    async function handleLogin(event) {
      if (event) event.preventDefault();
      const rawInput = document.getElementById('admin-password').value || '';
      const cleanPass = rawInput.trim().toLowerCase();
      const errorDiv = document.getElementById('login-error');
      if (errorDiv) errorDiv.style.display = 'none';

      // Accepted passcodes
      const validPasswords = [
        'galicon2030',
        'galicon2026',
        'ismail2030',
        'ismail2026',
        'galicon',
        '2030',
        'galiconexecutive#2026',
        'admin123',
        '123456'
      ];

      if (validPasswords.includes(cleanPass)) {
        const token = 'galicon_authenticated_executive_token_2030';
        sessionStorage.setItem('samrat_crm_token', token);
        localStorage.setItem('samrat_crm_token', token);
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('dashboard-view').style.display = 'block';
        await loadLeads(token);
        return;
      }

      if (errorDiv) {
        errorDiv.style.display = 'block';
        errorDiv.innerHTML = 'Incorrect passcode. Please enter: <strong style="color:#EAB308;">galicon2030</strong>';
      }
    }

    function handleLogout(event) {
      if (event) event.preventDefault();
      sessionStorage.removeItem('samrat_crm_token');
      localStorage.removeItem('samrat_crm_token');
      window.location.href = 'crm_dashboard.html';
    }

    async function loadLeads(token) {
      try {
        // Try live backend first
        const response = await fetch(`${API_BASE}/api/admin/leads`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const result = await response.json();
        if (result.success && result.leads) {
          LEADS_STORE = result.leads;
          document.getElementById('login-view').style.display = 'none';
          document.getElementById('dashboard-view').style.display = 'block';
          updateCounts();
          executeFilter();
          return;
        }
      } catch (err) {
        // Fallback to static leads_with_pitches.json for GitHub Pages
      }

      try {
        const fallbackRes = await fetch('leads_with_pitches.json');
        if (fallbackRes.ok) {
          const freshData = await fallbackRes.json();
          if (Array.isArray(freshData)) {
            LEADS_STORE = freshData;
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'block';
            updateCounts();
            executeFilter();
            return;
          }
        }
      } catch(e) {}

      document.getElementById('login-view').style.display = 'none';
      document.getElementById('dashboard-view').style.display = 'block';
      updateCounts();
      executeFilter();
    }

    function updateCounts() {
      document.getElementById('totalCount').textContent = LEADS_STORE.length;
      document.getElementById('activeCount').textContent = LEADS_STORE.length;
      document.getElementById('vipCount').textContent = LEADS_STORE.filter(l => l.leadScore >= 95).length;
      
      const uniqueCountries = new Set(LEADS_STORE.map(l => l.country)).size;
      document.getElementById('marketCount').textContent = uniqueCountries || 4;

      document.getElementById('cnt-all').textContent = LEADS_STORE.length;
      document.getElementById('cnt-sa').textContent = LEADS_STORE.filter(l => l.country === 'Saudi Arabia' || l.country === 'KSA').length;
      document.getElementById('cnt-blr').textContent = LEADS_STORE.filter(l => l.city === 'Bangalore').length;
      document.getElementById('cnt-uae').textContent = LEADS_STORE.filter(l => l.country === 'UAE' || l.country === 'United Arab Emirates').length;
      document.getElementById('cnt-uk').textContent = LEADS_STORE.filter(l => l.country === 'UK' || l.country === 'United Kingdom').length;
      document.getElementById('cnt-mum').textContent = LEADS_STORE.filter(l => l.city === 'Mumbai').length;
      document.getElementById('cnt-glb').textContent = LEADS_STORE.filter(l => l.country === 'USA' || l.country === 'Singapore').length;
    }

    let activeRep = 'All';

    function getAssignedRep(lead) {
      const service = (lead.targetService || '').toLowerCase();
      const cat = (lead.category || '').toLowerCase();
      const country = (lead.country || '').toLowerCase();
      const city = (lead.city || '').toLowerCase();

      if (country === 'saudi arabia' || country.includes('saudi')) return { rep: 'Rep 8 (Saudi Events)', icon: '🇸🇦' };
      if (country === 'uae' || city === 'dubai') return { rep: 'Rep 5 (GCC)', icon: '🏙️' };
      if (service.includes('event') || cat.includes('hotel') || cat.includes('convention')) return { rep: 'Rep 7 (BLR Events)', icon: '🎪' };
      if (cat.includes('ecommerce') || cat.includes('d2c') || cat.includes('retail') || cat.includes('fashion')) return { rep: 'Rep 4 (Ecom)', icon: '🛍️' };
      if (cat.includes('fintech') || cat.includes('bank') || cat.includes('consulting') || cat.includes('biotech')) return { rep: 'Rep 6 (B2B)', icon: '📈' };
      if (cat.includes('edtech') || cat.includes('saas') || cat.includes('ai') || cat.includes('software')) return { rep: 'Rep 2 (AI)', icon: '🤖' };
      if (cat.includes('mobility') || cat.includes('health') || cat.includes('gaming')) return { rep: 'Rep 3 (Apps)', icon: '📱' };
      if (cat.includes('strategy') || cat.includes('sop') || cat.includes('advisory')) return { rep: 'Rep 9 (Advisory)', icon: '🚀' };
      return { rep: 'Rep 1 (Tech)', icon: '⚡' };
    }

    function executeFilter() {
      let result = [...LEADS_STORE];

      // Regional Filter
      if (activeRegion === 'Saudi Arabia') {
        result = result.filter(l => l.country === 'Saudi Arabia');
      } else if (activeRegion === 'Bangalore') {
        result = result.filter(l => l.city === 'Bangalore');
      } else if (activeRegion === 'UAE') {
        result = result.filter(l => l.country === 'UAE' || l.country === 'United Arab Emirates');
      } else if (activeRegion === 'UK') {
        result = result.filter(l => l.country === 'UK' || l.country === 'United Kingdom');
      } else if (activeRegion === 'Mumbai') {
        result = result.filter(l => l.city === 'Mumbai');
      } else if (activeRegion === 'Global') {
        result = result.filter(l => l.country === 'USA' || l.country === 'Singapore');
      }

      // Sales Rep Filter
      if (activeRep !== 'All') {
        result = result.filter(l => getAssignedRep(l).rep === activeRep);
      }

      // Status Filter
      if (activeStatus === 'VIP') {
        result = result.filter(l => l.leadScore >= 95);
      }

      // Search Filter
      if (searchKeyword) {
        result = result.filter(l => 
          (l.businessName && l.businessName.toLowerCase().includes(searchKeyword)) ||
          (l.city && l.city.toLowerCase().includes(searchKeyword)) ||
          (l.country && l.country.toLowerCase().includes(searchKeyword)) ||
          (l.targetService && l.targetService.toLowerCase().includes(searchKeyword)) ||
          (l.category && l.category.toLowerCase().includes(searchKeyword))
        );
      }

      renderCards(result);
    }

    function selectRegion(region, btn) {
      activeRegion = region;
      document.querySelectorAll('#regionGroup .filter-chip-region').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      executeFilter();
    }

    function selectRep(repName, btn) {
      activeRep = repName;
      document.querySelectorAll('#repGroup .filter-chip').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      executeFilter();
    }

    function selectStatus(st, btn) {
      activeStatus = st;
      document.querySelectorAll('#statusGroup .filter-chip').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      executeFilter();
    }

    function onSearchChange() {
      searchKeyword = document.getElementById('searchBox').value.toLowerCase().trim();
      executeFilter();
    }

    function renderCards(list) {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      if (list.length === 0) {
        grid.innerHTML = '<div class="no-results">❌ No matching leads found in current filter cycle.</div>';
        return;
      }

      list.forEach(lead => {
        const isVip = lead.leadScore >= 95;
        const scoreClass = isVip ? 'score-high' : 'score-mid';
        const assigned = getAssignedRep(lead);
        
        // Resolve WhatsApp Link format
        let rawPhone = lead.phone || '';
        let cleanedPhone = rawPhone.replace(/[^0-9+]/g, '');
        if (cleanedPhone.startsWith('+')) cleanedPhone = cleanedPhone.substring(1);
        const waLink = `https://wa.me/${cleanedPhone}?text=Hello%20${encodeURIComponent(lead.businessName)}!`;

        const card = document.createElement('div');
        card.className = 'crm-card';
        card.innerHTML = `
          <div>
            <div class="d-flex justify-content-between align-items-start mb-2">
              <span class="score-badge ${scoreClass}">🎯 Score ${lead.leadScore || 90}</span>
              <span class="badge bg-primary text-white" style="font-size:0.7rem; font-weight:700;">${assigned.icon} ${assigned.rep}</span>
            </div>
            <h4 class="card-title">${lead.businessName}</h4>
            <p class="card-subtitle mb-2"><i class="fas fa-map-marker-alt text-warning me-1"></i>${lead.city}, ${lead.country} • ${lead.category}</p>
            <p class="small text-muted mb-1"><i class="fas fa-cog me-1"></i>${lead.targetService}</p>
            <p class="small text-muted"><i class="fas fa-envelope me-1"></i>${lead.email || 'N/A'}</p>
          </div>
          <div class="card-buttons">
            <a href="${waLink}" target="_blank" class="btn-action btn-wa"><i class="fab fa-whatsapp"></i> Chat</a>
            <a href="tel:${lead.phone}" class="btn-action btn-alt"><i class="fas fa-phone-alt"></i> Call</a>
