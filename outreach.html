        "email": "info@imaginemarketingindia.com",
        "website": "https://www.boat-lifestyle.com",
        "address": "Unit 501, Supreme Chambers, Andheri West",
        "city": "Mumbai",
        "country": "India",
        "leadScore": 94,
        "whatsappLink": "https://wa.me/912249461882?text=Hi%20boAt%20Lifestyle%20Growth%20Team!%20%F0%9F%91%8B%20We%20build%20high-converting%20performance%20marketing%20funnels.",
        "whatsappPitch": "Hi boAt Lifestyle Growth Team! 👋 We build high-converting performance marketing funnels.",
        "emailSubject": "Performance Acquisition Scaling for boAt Lifestyle",
        "emailBody": "Hi boAt Team,\n\nWe specialize in scalable D2C acquisition funnels.\n\nBest,\nGELICON GLOBAL"
      }
    ];

    let currentFilter = 'all';

    function renderLeads(leads) {
      const container = document.getElementById('leads-container');
      if (!leads.length) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 60px 0;">No matching leads found.</div>';
        return;
      }

      container.innerHTML = leads.map(l => `
        <div class="lead-card">
          <div class="lead-top">
            <div>
              <div class="lead-category">${l.category}</div>
              <h3 class="lead-name">${l.businessName}</h3>
            </div>
            <div class="lead-score">Score: ${l.leadScore}/100</div>
          </div>

          <div class="lead-meta">
            <div class="lead-meta-item">
              <i data-lucide="map-pin"></i>
              <span>${l.address}, ${l.city}, ${l.country}</span>
            </div>
            <div class="lead-meta-item">
              <i data-lucide="phone"></i>
              <span>${l.phone}</span>
            </div>
            <div class="lead-meta-item">
              <i data-lucide="mail"></i>
              <span>${l.email}</span>
            </div>
          </div>

          <div class="pitch-box">
            <strong>💬 AI Pitch Hook:</strong><br>
            "${l.whatsappPitch}"
          </div>

          <div class="lead-actions">
            <a href="${l.whatsappLink}" target="_blank" class="btn btn-whatsapp" style="font-size: 0.85rem; padding: 10px 14px;">
              <i data-lucide="message-circle"></i>
              <span>Send WhatsApp Pitch</span>
            </a>
            <button class="btn-copy-email" onclick="copyEmailPitch('${l.id}')" title="Copy Cold Email Pitch">
              <i data-lucide="copy"></i>
              <span>Email Copy</span>
            </button>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.dash-filters .pill-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-filter') === filter);
      });
      filterLeads();
    }

    function filterLeads() {
      const search = document.getElementById('lead-search').value.toLowerCase().trim();
      
      const filtered = leadsData.filter(l => {
        // City / Category Filter
        let matchesCategory = true;
        if (currentFilter === 'saudi') matchesCategory = l.country === 'Saudi Arabia';
        else if (currentFilter === 'bangalore') matchesCategory = l.city === 'Bangalore';
        else if (currentFilter === 'dubai') matchesCategory = l.city === 'Dubai';
        else if (currentFilter === 'london') matchesCategory = l.city === 'London';
        else if (currentFilter === 'global') matchesCategory = l.country !== 'Saudi Arabia' && l.city !== 'Bangalore' && l.city !== 'Dubai' && l.city !== 'London';

        // Search Filter
        const matchesSearch = !search || 
          (l.businessName && l.businessName.toLowerCase().includes(search)) ||
          (l.city && l.city.toLowerCase().includes(search)) ||
          (l.country && l.country.toLowerCase().includes(search)) ||
          (l.category && l.category.toLowerCase().includes(search));

        return matchesCategory && matchesSearch;
      });

      renderLeads(filtered);
    }

    function updateTabCounts() {
      if (!leadsData) return;
      document.getElementById('count-all').textContent = leadsData.length;
      document.getElementById('count-saudi').textContent = leadsData.filter(l => l.country === 'Saudi Arabia').length;
      document.getElementById('count-blr').textContent = leadsData.filter(l => l.city === 'Bangalore').length;
      document.getElementById('count-dubai').textContent = leadsData.filter(l => l.city === 'Dubai').length;
      document.getElementById('count-london').textContent = leadsData.filter(l => l.city === 'London').length;
      document.getElementById('count-global').textContent = leadsData.filter(l => l.country !== 'Saudi Arabia' && l.city !== 'Bangalore' && l.city !== 'Dubai' && l.city !== 'London').length;
    }

    function copyEmailPitch(leadId) {
      const lead = leadsData.find(l => l.id === leadId);
      if (!lead) return;

      const fullEmailText = `Subject: ${lead.emailSubject}\n\n${lead.emailBody}`;
      navigator.clipboard.writeText(fullEmailText).then(() => {
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2200);
      });
    }

    // Dynamic Initialization
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('leads_with_pitches.json');
        if (res.ok) {
          const freshData = await res.json();
          if (Array.isArray(freshData) && freshData.length > 0) {
            leadsData = freshData;
          }
        }
      } catch (e) {
        console.log('Using pre-bundled leads dataset');
      }
      updateTabCounts();
      renderLeads(leadsData);
    });
  </script>
</body>
</html>
