<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Client Outreach Portal | GALICON GLOBAL</title>
  <meta name="description" content="Executive outreach system and B2B pipeline dispatcher for global corporate summits, luxury real estate funnels, and enterprise clients.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    (function() {
      if (!sessionStorage.getItem('samrat_crm_token')) {
        sessionStorage.setItem('samrat_crm_token', 'galicon_authenticated_executive_token_2026');
      }
    })();
  </script>
  <style>
    /* Dashboard-Specific Overrides */
    .dashboard-header {
      padding: 40px 0 20px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(13, 18, 31, 0.6);
      backdrop-filter: blur(12px);
    }
    .dash-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }
    .dash-title {
      font-size: 1.8rem;
      font-weight: 800;
    }
    .dash-filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    .search-box {
      width: 100%;
      max-width: 380px;
      position: relative;
    }
    .search-box input {
      padding-left: 40px;
    }
    .search-box i {
      position: absolute;
      left: 14px;
      top: 14px;
      color: var(--text-muted);
      width: 18px;
      height: 18px;
    }
    
    /* Leads Grid */
    .leads-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 24px;
      padding: 40px 0 80px;
    }
    .lead-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: var(--transition);
      backdrop-filter: blur(12px);
    }
    .lead-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
    }
    .lead-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .lead-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: white;
      margin-bottom: 4px;
    }
    .lead-category {
      font-size: 0.8rem;
      color: var(--accent-cyan);
      font-weight: 600;
    }
    .lead-score {
      background: rgba(16, 185, 129, 0.15);
      color: #10B981;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 3px 8px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .lead-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .lead-meta-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .lead-meta-item i {
      width: 14px;
      height: 14px;
      color: var(--primary);
    }
    .pitch-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px;
      font-size: 0.82rem;
      color: #CBD5E1;
      margin-bottom: 18px;
      line-height: 1.5;
      max-height: 110px;
      overflow-y: auto;
      flex-grow: 1;
    }
    .lead-actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: auto;
    }
    .btn-copy-email {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }
    .btn-copy-email:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #10B981;
      color: #07090E;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: none;
      z-index: 999;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  
    /* UNIVERSAL HIGH-CONTRAST FONT VISIBILITY (GALICON 2026) */
    body { color: #F8FAFC !important; }
    p, li, .lead, .problem-pill, .audit-choice { color: #CBD5E1 !important; }
    .text-muted, .text-secondary { color: #CBD5E1 !important; }
    .card-dark, .div-card, .calc-card, .audit-card, .widescreen-booking-card { color: #F8FAFC !important; }
    .card-dark p, .card-dark li, .card-dark ul,
    .div-card p, .div-card li, .div-card ul,
    .calc-card p, .calc-card li, .calc-card ul,
    .audit-card p, .audit-card li, .audit-card ul,
    .widescreen-booking-card p, .widescreen-booking-card li { color: #E2E8F0 !important; }
    .price-box .text-muted, .div-price-chip .text-muted { color: #94A3B8 !important; }
  </style>
  <link rel="canonical" href="https://ismailkazia302-bot.github.io/samrat-global/outreach.html">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ismailkazia302-bot.github.io/samrat-global/outreach.html">
  <meta property="og:title" content="Enterprise Client Outreach Portal | GALICON GLOBAL">
  <meta property="og:description" content="Executive outreach system and B2B pipeline dispatcher for global corporate summits, luxury real estate funnels, and enterprise clients.">
  <meta property="og:image" content="https://ismailkazia302-bot.github.io/samrat-global/galicon_logo.png">
  <meta property="og:site_name" content="GALICON GLOBAL">
  <meta name="author" content="Ismail Kazia">

  <!-- Schema.org JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Enterprise Client Outreach Portal | GALICON GLOBAL",
    "url": "https://ismailkazia302-bot.github.io/samrat-global/outreach.html",
    "description": "Executive outreach system and B2B pipeline dispatcher for global corporate summits, luxury real estate funnels, and enterprise clients.",
    "author": {
      "@type": "Person",
      "name": "Ismail Kazia",
      "jobTitle": "Founder & CEO"
    },
    "publisher": {
      "@type": "Organization",
      "name": "GALICON GLOBAL",
      "url": "https://ismailkazia302-bot.github.io/samrat-global/",
      "logo": "https://ismailkazia302-bot.github.io/samrat-global/galicon_logo.png"
    }
  }
  </script>
</head>
<body>
  <!-- Ambient Glows -->
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <span class="logo-crown">👑</span>
        <span class="logo-text royal-font">GALICON</span>
        <span class="logo-sub">OUTREACH HUB</span>
      </a>

      <div class="nav-actions">
        <a href="index.html" class="btn btn-secondary">
          <i data-lucide="external-link"></i>
          <span>View Public Portal</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Dashboard Header -->
  <div class="dashboard-header">
    <div class="container">
      <div class="dash-top">
        <div>
          <h1 class="dash-title">🎯 1-Click B2B Sales & Outreach Dispatcher</h1>
          <p class="section-subtitle" style="text-align: left; margin: 4px 0 0;">
            312 Verified High-Ticket Bangalore, Saudi Arabia, Dubai & Global Enterprise Leads with Custom 1-Click AI Pitches
          </p>
        </div>

        <div class="search-box">
          <i data-lucide="search"></i>
          <input type="text" id="lead-search" placeholder="Search company, city, category..." oninput="filterLeads()">
        </div>
        
           <!-- Filter Tabs -->
      <div class="dash-filters">
        <button class="pill-btn active" data-filter="all" onclick="setFilter('all')">
          <i data-lucide="layers"></i> All Leads (<span id="count-all">312</span>)
        </button>
        <button class="pill-btn" data-filter="bangalore" onclick="setFilter('bangalore')">
          <i data-lucide="map-pin"></i> Bangalore Events 🇮🇳 (<span id="count-blr">112</span>)
        </button>
        <button class="pill-btn" data-filter="saudi" onclick="setFilter('saudi')">
          <i data-lucide="shield-check"></i> Saudi Arabia 🇸🇦 (<span id="count-saudi">81</span>)
        </button>
        <button class="pill-btn" data-filter="dubai" onclick="setFilter('dubai')">
          <i data-lucide="building-2"></i> Dubai Real Estate 🇦🇪 (<span id="count-dubai">55</span>)
        </button>
        <button class="pill-btn" data-filter="london" onclick="setFilter('london')">
          <i data-lucide="stethoscope"></i> London Clinics 🇬🇧 (<span id="count-london">25</span>)
        </button>
        <button class="pill-btn" data-filter="global" onclick="setFilter('global')">
          <i data-lucide="globe"></i> Mumbai & Global 🌍 (<span id="count-global">39</span>)
        </button>
        <a href="outreach_ready.csv" download class="pill-btn" style="background:rgba(16,185,129,0.15); border-color:#10B981; color:#10B981; text-decoration:none; margin-left:auto;">
          <i data-lucide="download"></i> Download All 312 CSV
        </a>
      </div>
    </div>
  </div>

  <!-- Main Leads Container -->
  <main class="container">
    <div class="leads-grid" id="leads-container">
      <!-- Dynamically Injected by JavaScript -->
    </div>
  </main>

  <!-- Notification Toast -->
  <div id="toast" class="toast">✓ Cold Email Pitch Copied to Clipboard!</div>

  <script>
    let leadsData = [];
    let currentFilter = 'all';

    function renderLeads(leads) {
      const container = document.getElementById('leads-container');
      if (!leads.length) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 60px 0;">No matching leads found.</div>';
        return;
      }

      container.innerHTML = leads.map(l => `
        <div class="lead-card">
          <div class="lead-top">
            <div>
              <div class="lead-category">${l.category || 'Enterprise Lead'}</div>
              <h3 class="lead-name">${l.businessName || 'Business Name'}</h3>
            </div>
            <div class="lead-score">Score: ${l.leadScore || 95}/100</div>
          </div>

          <div class="lead-meta">
            <div class="lead-meta-item">
              <i data-lucide="map-pin"></i>
              <span>${l.address || ''}, ${l.city || ''}, ${l.country || ''}</span>
            </div>
            <div class="lead-meta-item">
              <i data-lucide="phone"></i>
              <span>${l.phone || 'N/A'}</span>
            </div>
            <div class="lead-meta-item">
              <i data-lucide="mail"></i>
              <span>${l.email || 'N/A'}</span>
            </div>
          </div>

          <div class="pitch-box">
            <strong>💬 1-Click AI Pitch Hook:</strong><br>
            "${l.whatsappPitch || ''}"
          </div>

          <div class="lead-actions" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;">
            <a href="${l.whatsappLink || '#'}" target="_blank" class="btn btn-whatsapp" style="font-size: 0.82rem; padding: 8px 12px; flex:1; min-width:140px;">
              <i data-lucide="message-circle"></i>
              <span>Send WhatsApp</span>
            </a>
            ${l.mailtoLink ? `
              <a href="${l.mailtoLink}" class="btn" style="background:#635BFF; color:#fff; font-size:0.82rem; padding:8px 12px; border-radius:8px; text-decoration:none; display:inline-flex; align-items:center; gap:6px;">
                <i data-lucide="send"></i>
                <span>Open Mail</span>
              </a>
            ` : ''}
            <button class="btn-copy-email" onclick="copyEmailPitch('${l.id}')" title="Copy Cold Email Pitch" style="font-size:0.82rem; padding:8px 12px;">
              <i data-lucide="copy"></i>
              <span>Copy</span>
            </button>
          </div>
        </div>
      `).join('');

      if (window.lucide && typeof lucide.createIcons === 'function') {
        lucide.createIcons();
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.dash-filters .pill-btn').forEach(btn => {
        if (btn.hasAttribute('data-filter')) {
          btn.classList.toggle('active', btn.getAttribute('data-filter') === filter);
        }
      });
      filterLeads();
    }

    function filterLeads() {
      const search = (document.getElementById('lead-search').value || '').toLowerCase().trim();
      
      const filtered = leadsData.filter(l => {
        // City / Category Filter
        let matchesCategory = true;
        const country = (l.country || '').toLowerCase();
        const city = (l.city || '').toLowerCase();

        if (currentFilter === 'saudi') matchesCategory = country.includes('saudi') || city.includes('riyadh') || city.includes('jeddah');
        else if (currentFilter === 'bangalore') matchesCategory = city.includes('bangalore');
        else if (currentFilter === 'dubai') matchesCategory = city.includes('dubai') || country.includes('uae') || city.includes('abu dhabi');
        else if (currentFilter === 'london') matchesCategory = city.includes('london') || country.includes('uk');
        else if (currentFilter === 'global') matchesCategory = !city.includes('bangalore') && !country.includes('saudi') && !city.includes('dubai') && !city.includes('london');

        // Search Filter
        const matchesSearch = !search || 
          ((l.businessName || '').toLowerCase().includes(search)) ||
          ((l.city || '').toLowerCase().includes(search)) ||
          ((l.country || '').toLowerCase().includes(search)) ||
          ((l.category || '').toLowerCase().includes(search));

        return matchesCategory && matchesSearch;
      });

      renderLeads(filtered);
    }

    function updateTabCounts() {
      if (!leadsData || !leadsData.length) return;
      document.getElementById('count-all').textContent = leadsData.length;
      document.getElementById('count-saudi').textContent = leadsData.filter(l => (l.country || '').includes('Saudi') || (l.city || '').includes('Riyadh') || (l.city || '').includes('Jeddah')).length;
      document.getElementById('count-blr').textContent = leadsData.filter(l => (l.city || '').includes('Bangalore')).length;
      document.getElementById('count-dubai').textContent = leadsData.filter(l => (l.city || '').includes('Dubai') || (l.country || '').includes('UAE') || (l.city || '').includes('Abu Dhabi')).length;
      document.getElementById('count-london').textContent = leadsData.filter(l => (l.city || '').includes('London') || (l.country || '').includes('UK')).length;
      document.getElementById('count-global').textContent = leadsData.filter(l => !(l.city || '').includes('Bangalore') && !(l.country || '').includes('Saudi') && !(l.city || '').includes('Dubai') && !(l.city || '').includes('London')).length;
    }

    function copyEmailPitch(leadId) {
      const lead = leadsData.find(l => l.id === leadId);
      if (!lead) return;

      const fullEmailText = `Subject: ${lead.emailSubject || ''}\n\n${lead.emailBody || ''}`;
      navigator.clipboard.writeText(fullEmailText).then(() => {
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2200);
      });
    }

    // Dynamic Initialization
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('leads_with_pitches.json');
        if (res.ok) {
          const freshData = await res.json();
          if (Array.isArray(freshData) && freshData.length > 0) {
            leadsData = freshData;
          }
        }
      } catch (e) {
        console.error('Error fetching leads_with_pitches.json', e);
      }
      updateTabCounts();
      renderLeads(leadsData);
    });
  </script>
</body>
</html>
